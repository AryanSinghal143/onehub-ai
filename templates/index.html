<!DOCTYPE html>
<html>
<head>
    <title>AI Ticket System</title>
</head>
<body>

<h2>Create Ticket</h2>

<form id="form">
    <input id="title" placeholder="Title"><br><br>
    <textarea id="desc" placeholder="Description"></textarea><br><br>
    <input id="email" placeholder="Email"><br><br>
    <button>Submit</button>
</form>

<h3>Response:</h3>
<pre id="out"></pre>

<script>
form.onsubmit = async (e)=>{
    e.preventDefault();

    let res = await fetch("/ticket",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
            title:title.value,
            description:desc.value,
            email:email.value
        })
    });

    let data = await res.json();
    out.innerText = data.response;
}
</script>

</body>
</html>
