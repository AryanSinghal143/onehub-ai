<!DOCTYPE html>
<html>
<head>
    <title>Smart Ticket System</title>
</head>
<body>

<h2>Create Ticket</h2>

<input id="title" placeholder="Title"><br><br>
<textarea id="description" placeholder="Description"></textarea><br><br>
<input id="email" placeholder="Email"><br><br>

<button onclick="submitTicket()">Submit</button>

<h3 id="response"></h3>

<hr>

<h2>Multi-Source Tickets</h2>
<button onclick="loadTickets()">Load Tickets</button>

<div id="tickets"></div>

<script>
async function submitTicket() {
    const title = document.getElementById("title").value;
    const description = document.getElementById("description").value;
    const email = document.getElementById("email").value;

    try {
        const res = await fetch("/ticket", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ title, description, email })
        });

        const data = await res.json();

        document.getElementById("response").innerText =
            "✅ " + data.message +
            "\nCategory: " + data.category +
            "\nPriority: " + data.priority +
            "\nTicket ID: " + data.ticket_id;

    } catch (err) {
        document.getElementById("response").innerText = "❌ Error occurred";
    }
}

async function loadTickets() {
    const res = await fetch("/process-tickets");
    const data = await res.json();

    let html = "";

    data.data.forEach(t => {
        html += `
            <div style="border:1px solid black; margin:10px; padding:10px;">
                <b>Source:</b> ${t.source}<br>
                <b>Title:</b> ${t.title}<br>
                <b>Category:</b> ${t.category}<br>
                <b>Priority:</b> ${t.priority}
            </div>
        `;
    });

    document.getElementById("tickets").innerHTML = html;
}
</script>

</body>
</html>
