<!DOCTYPE html>
<html>
<head>
    <title>AI Ticket System</title>
</head>
<body>

<h2>Create Ticket</h2>

<form id="form">
    <input id="title" placeholder="Title" required><br><br>
    <textarea id="desc" placeholder="Description" required></textarea><br><br>
    <input id="email" placeholder="Email" required><br><br>
    <button type="submit">Submit</button>
</form>

<h3>Response:</h3>
<pre id="out"></pre>

<script>
document.getElementById("form").addEventListener("submit", async function(e) {
    e.preventDefault();

    try {
        const res = await fetch("/ticket", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                title: document.getElementById("title").value,
                description: document.getElementById("desc").value,
                email: document.getElementById("email").value
            })
        });

        if (!res.ok) {
            throw new Error("Server Error");
        }

        const data = await res.json();
        document.getElementById("out").innerText = data.response;

    } catch (err) {
        document.getElementById("out").innerText = "Error: " + err.message;
    }
});
</script>

</body>
</html>
